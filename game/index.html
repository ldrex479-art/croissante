<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adu Penalti 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#000;touch-action:none;}
  #hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#fff;text-shadow:2px 2px 6px #000;font-size:16px;font-weight:bold;text-align:center;z-index:10;pointer-events:none;}
  #hud .stat{display:inline-block;margin:0 10px;}
  #msg{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);color:#FFD700;font-size:44px;font-weight:900;text-shadow:3px 3px 10px #000;opacity:0;transition:opacity 0.25s;z-index:20;pointer-events:none;white-space:nowrap;letter-spacing:2px;}
  #powerWrap{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);width:60%;max-width:400px;height:18px;background:rgba(0,0,0,0.6);border-radius:10px;border:2px solid #fff;overflow:hidden;z-index:10;display:none;box-shadow:0 0 20px rgba(255,255,255,0.3);}
  #powerFill{height:100%;width:0%;background:linear-gradient(90deg,#0f0,#ff0,#f00);transition:width 0.03s linear;}
  #hint{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);color:#fff;text-shadow:2px 2px 4px #000;font-size:14px;z-index:10;pointer-events:none;font-weight:bold;}
  #startScreen{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%, #1a3a5c, #000);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:100;text-align:center;padding:20px;}
  #startScreen h1{font-size:34px;margin-bottom:15px;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,0.6);}
  #startScreen p{font-size:15px;margin-bottom:25px;opacity:0.85;line-height:1.7;}
  #startScreen button{padding:16px 50px;font-size:20px;font-weight:bold;background:linear-gradient(180deg,#FFD700,#FF9500);color:#000;border:none;border-radius:50px;cursor:pointer;box-shadow:0 6px 20px rgba(255,215,0,0.5);}
  #startScreen button:active{transform:scale(0.95);}
</style>
</head>
<body>
<div id="hud">
  <span class="stat">⚽ GOL: <span id="goals">0</span></span>
  <span class="stat">🎯 TEMBAKAN: <span id="shots">0</span></span>
</div>
<div id="msg"></div>
<div id="powerWrap"><div id="powerFill"></div></div>
<div id="hint">Tap untuk mengarahkan</div>
<div id="startScreen">
  <h1>⚽ ADU PENALTI 3D</h1>
  <p>Tap 1: kunci arah tembakan<br>Tap 2: kunci kekuatan tembakan<br><br>Cetak gol sebanyak mungkin!</p>
  <button id="startBtn">MULAI</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 35, 90);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 4.2, 11);
camera.lookAt(0, 1.5, -5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xfff5e0, 0.9);
sun.position.set(12, 22, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25; sun.shadow.camera.bottom = -25;
scene.add(sun);
[[-18,-18],[18,-18],[-18,18],[18,18]].forEach(([x,z])=>{
  const s = new THREE.SpotLight(0xffffff, 0.35);
  s.position.set(x, 28, z);
  s.target.position.set(0, 0, -3);
  s.angle = Math.PI/4; s.penumbra = 0.6;
  scene.add(s); scene.add(s.target);
});

function grassTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=512;
  const g=c.getContext('2d');
  for(let i=0;i<16;i++){ g.fillStyle=i%2===0?'#2a7d3a':'#33954a'; g.fillRect(0,i*32,512,32); }
  for(let i=0;i<9000;i++){ g.fillStyle=`rgba(0,0,0,${Math.random()*0.12})`; g.fillRect(Math.random()*512,Math.random()*512,2,2); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(5,5); return t;
}
const pitch = new THREE.Mesh(new THREE.PlaneGeometry(60,60), new THREE.MeshStandardMaterial({map:grassTex(),roughness:0.95}));
pitch.rotation.x=-Math.PI/2; pitch.receiveShadow=true; scene.add(pitch);

const wm = new THREE.MeshBasicMaterial({color:0xffffff});
const gl = new THREE.Mesh(new THREE.PlaneGeometry(22,0.12), wm); gl.rotation.x=-Math.PI/2; gl.position.set(0,0.01,-5); scene.add(gl);
const boxL = new THREE.Mesh(new THREE.PlaneGeometry(0.12,11), wm); boxL.rotation.x=-Math.PI/2; boxL.position.set(-9,0.01,0.5); scene.add(boxL);
const boxR = boxL.clone(); boxR.position.x=9; scene.add(boxR);
const boxF = new THREE.Mesh(new THREE.PlaneGeometry(18,0.12), wm); boxF.rotation.x=-Math.PI/2; boxF.position.set(0,0.01,6); scene.add(boxF);
const spot = new THREE.Mesh(new THREE.CircleGeometry(0.11,16), wm); spot.rotation.x=-Math.PI/2; spot.position.set(0,0.02,4); scene.add(spot);

function crowdTex(){
  const c=document.createElement('canvas'); c.width=1024; c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#15151f'; g.fillRect(0,0,1024,256);
  const cols=['#e74c3c','#3498db','#f39c12','#2ecc71','#9b59b6','#ecf0f1','#e67e22','#1abc9c','#c0392b','#2980b9'];
  for(let i=0;i<8000;i++){ g.fillStyle=cols[Math.floor(Math.random()*cols.length)]; g.beginPath(); g.arc(Math.random()*1024,Math.random()*256,1.5+Math.random()*2,0,Math.PI*2); g.fill(); }
  return new THREE.CanvasTexture(c);
}
const ct = crowdTex(); ct.wrapS=ct.wrapT=THREE.RepeatWrapping; ct.repeat.set(5,1);
const standMat = new THREE.MeshStandardMaterial({map:ct, roughness:1, side:THREE.DoubleSide});
const standH=10, standW=70;
[[0,-30,0],[0,30,Math.PI],[30,0,-Math.PI/2],[-30,0,Math.PI/2]].forEach(([x,z,ry])=>{
  const s = new THREE.Mesh(new THREE.PlaneGeometry(standW, standH), standMat);
  s.position.set(x, standH/2, z); s.rotation.y = ry; scene.add(s);
});
[[0,-30,0],[0,30,Math.PI],[30,0,-Math.PI/2],[-30,0,Math.PI/2]].forEach(([x,z,ry])=>{
  const r = new THREE.Mesh(new THREE.BoxGeometry(standW,0.3,3), new THREE.MeshStandardMaterial({color:0x222233}));
  r.position.set(x, standH, z); r.rotation.y = ry;
  r.translateZ(-1.5); scene.add(r);
});

const goalGrp = new THREE.Group();
const postMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.35, metalness:0.4});
const postGeo = new THREE.CylinderGeometry(0.08,0.08,2.44,16);
const pL = new THREE.Mesh(postGeo,postMat); pL.position.set(-3.66,1.22,-5); pL.castShadow=true; goalGrp.add(pL);
const pR = pL.clone(); pR.position.x=3.66; goalGrp.add(pR);
const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,7.32,16),postMat);
bar.rotation.z=Math.PI/2; bar.position.set(0,2.44,-5); bar.castShadow=true; goalGrp.add(bar);
const netMat = new THREE.MeshBasicMaterial({color:0xffffff, wireframe:true, transparent:true, opacity:0.22});
const nB = new THREE.Mesh(new THREE.PlaneGeometry(7.32,2.44,24,10),netMat); nB.position.set(0,1.22,-6.5); goalGrp.add(nB);
const nT = new THREE.Mesh(new THREE.PlaneGeometry(7.32,1.5,24,6),netMat); nT.rotation.x=-Math.PI/2; nT.position.set(0,2.44,-5.75); goalGrp.add(nT);
const nL = new THREE.Mesh(new THREE.PlaneGeometry(1.5,2.44,6,10),netMat); nL.rotation.y=Math.PI/2; nL.position.set(-3.66,1.22,-5.75); goalGrp.add(nL);
const nR = nL.clone(); nR.position.x=3.66; goalGrp.add(nR);
scene.add(goalGrp);

function makeKeeper(){
  const g = new THREE.Group();
  const jersey = new THREE.MeshStandardMaterial({color:0x00c853, roughness:0.7});
  const skin = new THREE.MeshStandardMaterial({color:0xffcc99, roughness:0.8});
  const shorts = new THREE.MeshStandardMaterial({color:0x111111});

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.7,0.3), jersey);
  torso.position.y=1.0; torso.castShadow=true; g.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16,16,16), skin);
  head.position.y=1.52; head.castShadow=true; g.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.17,16,16,0,Math.PI*2,0,Math.PI/2), new THREE.MeshStandardMaterial({color:0x222222}));
  hair.position.y=1.55; g.add(hair);

  const armGeo = new THREE.BoxGeometry(0.12,0.6,0.12);
  const armL = new THREE.Mesh(armGeo, jersey); armL.position.set(-0.35,1.0,0); armL.castShadow=true; g.add(armL);
  const armR = armL.clone(); armR.position.x=0.35; g.add(armR);

  const gloveGeo = new THREE.SphereGeometry(0.1,12,12);
  const gloveMat = new THREE.MeshStandardMaterial({color:0xffee00, emissive:0x332200});
  const gL = new THREE.Mesh(gloveGeo, gloveMat); gL.position.set(-0.35,0.68,0); g.add(gL);
  const gR = gL.clone(); gR.position.x=0.35; g.add(gR);

  const legGeo = new THREE.BoxGeometry(0.16,0.6,0.16);
  const legL = new THREE.Mesh(legGeo, shorts); legL.position.set(-0.13,0.33,0); legL.castShadow=true; g.add(legL);
  const legR = legL.clone(); legR.position.x=0.13; g.add(legR);

  const bootMat = new THREE.MeshStandardMaterial({color:0x111111});
  const bootL = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.12,0.3), bootMat); bootL.position.set(-0.13,0.06,0.06); g.add(bootL);
  const bootR = bootL.clone(); bootR.position.x=0.13; g.add(bootR);

  g.userData = {armL,armR,gL,gR};
  return g;
}
const keeper = makeKeeper();
keeper.position.set(0,0,-4.7); scene.add(keeper);

function ballTex(){
  const c=document.createElement('canvas'); c.width=256; c.height=128;
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,256,128);
  g.fillStyle='#111';
  for(let i=0;i<35;i++){
    const x=Math.random()*256, y=Math.random()*128;
    g.beginPath();
    for(let j=0;j<5;j++){ const a=j/5*Math.PI*2; const px=x+Math.cos(a)*7, py=y+Math.sin(a)*7; j===0?g.moveTo(px,py):g.lineTo(px,py); }
    g.closePath(); g.fill();
  }
  return new THREE.CanvasTexture(c);
}
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.12,32,32), new THREE.MeshStandardMaterial({map:ballTex(), roughness:0.4}));
ball.position.set(0,0.12,4); ball.castShadow=true; scene.add(ball);

const reticle = new THREE.Mesh(new THREE.RingGeometry(0.22,0.32,32), new THREE.MeshBasicMaterial({color:0xff3b30, side:THREE.DoubleSide, transparent:true, opacity:0.9}));
reticle.position.set(0,1.3,-4.9); reticle.visible=false; scene.add(reticle);
const reticleDot = new THREE.Mesh(new THREE.CircleGeometry(0.06,16), new THREE.MeshBasicMaterial({color:0xff3b30}));
reticleDot.position.set(0,1.3,-4.9); reticleDot.visible=false; scene.add(reticleDot);

let state='IDLE', aimX=0, aimDir=1, power=0, powerDir=1;
let goals=0, shots=0, ballT=0, ballCurve=null, ballStart=new THREE.Vector3();
let keeperDive=null, resultChecked=false, slowmo=1, shake=0;
const goalsEl=document.getElementById('goals'), shotsEl=document.getElementById('shots');
const msgEl=document.getElementById('msg'), powerWrap=document.getElementById('powerWrap'), powerFill=document.getElementById('powerFill');
const hintEl=document.getElementById('hint'), startScreen=document.getElementById('startScreen'), startBtn=document.getElementById('startBtn');

function showMsg(t,c,d=1500){ msgEl.textContent=t; msgEl.style.color=c||'#FFD700'; msgEl.style.opacity=1; clearTimeout(showMsg._t); showMsg._t=setTimeout(()=>msgEl.style.opacity=0,d); }

function resetArms(){
  const u=keeper.userData;
  u.armL.rotation.z=0; u.armR.rotation.z=0;
  u.armL.position.set(-0.35,1.0,0); u.armR.position.set(0.35,1.0,0);
  u.gL.position.set(-0.35,0.68,0); u.gR.position.set(0.35,0.68,0);
}

function startAiming(){
  state='AIM'; reticle.visible=true; reticleDot.visible=true;
  aimX=0; aimDir=1; power=0;
  hintEl.textContent='👆 Tap untuk mengarahkan'; hintEl.style.display='block';
  ball.position.set(0,0.12,4); ball.rotation.set(0,0,0);
  keeper.position.set(0,0,-4.7); keeper.rotation.set(0,0,0);
  resetArms();
  keeperDive=null; resultChecked=false; ballT=0; slowmo=1; ballCurve=null;
  powerWrap.style.display='none';
  camera.position.set(0,4.2,11);
}

function shoot(){
  state='SHOOT'; shots++; shotsEl.textContent=shots;
  hintEl.style.display='none'; powerWrap.style.display='none';
  reticle.visible=false; reticleDot.visible=false;

  const spread=(power/100)*0.5;
  const tx=aimX+(Math.random()-0.5)*spread;
  const ty=1.35+(Math.random()-0.5)*0.35;
  const target=new THREE.Vector3(tx, Math.max(0.15,ty), -5);
  ballStart.copy(ball.position);
  const ctrl=new THREE.Vector3(
    (ballStart.x+target.x)/2+(Math.random()-0.5)*1.8,
    1.5+power/180,
    (ballStart.z+target.z)/2
  );
  ballCurve=new THREE.QuadraticBezierCurve3(ballStart, ctrl, target);
  ballT=0; resultChecked=false;

  let kx;
  if(Math.random()<0.4){
    if(tx<-0.9) kx=-2.6; else if(tx>0.9) kx=2.6; else kx=0;
    kx+=(Math.random()-0.5)*0.7;
  } else {
    kx=(Math.random()-0.5)*5.4;
  }
  keeperDive={targetX:kx, t:0};

  playKick(); shake=0.12;
}

function onTap(){
  if(state==='AIM'){ state='POWER'; power=0; powerDir=1; powerWrap.style.display='block'; hintEl.textContent='👆 Tap untuk kekuatan'; playWhistle(); }
  else if(state==='POWER'){ shoot(); }
}
document.addEventListener('pointerdown', onTap);
startBtn.addEventListener('click', ()=>{ initAudio(); startScreen.style.display='none'; startAiming(); });

let ac=null;
function initAudio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function playKick(){ if(!ac)return; const t=ac.currentTime; const o=ac.createOscillator(), g=ac.createGain();
  o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(40,t+0.1);
  g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.2); }
function playWhistle(){ if(!ac)return; const t=ac.currentTime; const o=ac.createOscillator(), g=ac.createGain();
  o.type='sine'; o.frequency.setValueAtTime(1900,t); o.frequency.linearRampToValueAtTime(2400,t+0.3);
  g.gain.setValueAtTime(0.08,t); g.gain.linearRampToValueAtTime(0,t+0.4);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.4); }
function playCheer(){ if(!ac)return; const t=ac.currentTime;
  const buf=ac.createBuffer(1,ac.sampleRate*1.5,ac.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
  const src=ac.createBufferSource(); src.buffer=buf;
  const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=0.8;
  const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.18,t+0.2); g.gain.linearRampToValueAtTime(0,t+1.5);
  src.connect(f).connect(g).connect(ac.destination); src.start(t); src.stop(t+1.5); }

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05)*slowmo;

  if(state==='AIM'){
    aimX+=aimDir*dt*4.2;
    if(aimX>3.1){aimX=3.1;aimDir=-1;} if(aimX<-3.1){aimX=-3.1;aimDir=1;}
    reticle.position.x=aimX; reticleDot.position.x=aimX;
    const s=1+Math.sin(performance.now()/140)*0.12;
    reticle.scale.set(s,s,s);
  }
  if(state==='POWER'){
    power+=powerDir*dt*130;
    if(power>100){power=100;powerDir=-1;} if(power<0){power=0;powerDir=1;}
    powerFill.style.width=power+'%';
    reticle.position.x=aimX; reticleDot.position.x=aimX;
  }
  if(state==='SHOOT' && ballCurve){
    ballT+=dt*1.7; if(ballT>1) ballT=1;
    const p=ballCurve.getPoint(ballT);
    ball.position.copy(p);
    ball.rotation.x-=dt*22; ball.rotation.z+=dt*6;

    if(keeperDive){
      keeperDive.t=Math.min(1, keeperDive.t+dt*2.8);
      const e=1-Math.pow(1-keeperDive.t,3);
      keeper.position.x=keeperDive.targetX*e;
      keeper.rotation.z=-keeperDive.targetX*0.13*e;
      const u=keeper.userData;
      u.armL.rotation.z=-Math.PI/2*e;
      u.armR.rotation.z=Math.PI/2*e;
      u.armL.position.set(-0.35-0.25*e, 1.0+0.15*e, 0);
      u.armR.position.set(0.35+0.25*e, 1.0+0.15*e, 0);
      u.gL.position.set(-0.35-0.4*e, 1.0+0.15*e, 0);
      u.gR.position.set(0.35+0.4*e, 1.0+0.15*e, 0);
    }

    if(ballT>=0.78 && !resultChecked){
      resultChecked=true;
      const bx=ball.position.x, by=ball.position.y;
      const inGoal=Math.abs(bx)<3.62 && by<2.4 && by>0;
      const kx=keeperDive? keeper.position.x : 0;
      const reach=1.05;

      if(!inGoal){
        showMsg('MELESET! ❌','#FF4444'); slowmo=0.4;
        setTimeout(()=>{ slowmo=1; setTimeout(startAiming,500); }, 900);
      } else if(keeperDive && keeperDive.t>0.35 && Math.abs(bx-kx)<reach){
        showMsg('DITANGKAP! 🧤','#FF9500'); slowmo=0.3;
        setTimeout(()=>{ slowmo=1; setTimeout(startAiming,500); }, 1300);
      } else {
        goals++; goalsEl.textContent=goals;
        showMsg('GOOOAL! ⚽','#00FF00'); slowmo=0.35; playCheer();
        setTimeout(()=>{ slowmo=1; setTimeout(startAiming,700); }, 1500);
      }
      state='RESULT';
    }
  }

  if(shake>0){
    camera.position.x=(Math.random()-0.5)*shake;
    camera.position.y=4.2+(Math.random()-0.5)*shake;
    shake*=0.9; if(shake<0.002){shake=0; camera.position.set(0,4.2,11);}
  }
  if(state==='SHOOT' && ballT>0){
    camera.lookAt(ball.position.x*0.35, 1.6, -5);
  } else if(state!=='SHOOT'){
    camera.lookAt(0,1.5,-5);
  }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
